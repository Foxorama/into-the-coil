# The check branch protection requires. The required context is the JOB KEY — `test` — not this
# workflow's name.
name: tests

on:
  pull_request:
  # Dispatch matters more than it looks: the scaffold phases land directly on an unprotected
  # `main`, so this workflow produces ZERO runs on its own, and protection cannot require a check
  # that has never reported. The Run button only appears once this file is on the default branch.
  workflow_dispatch:
  # For `release.yml` to call. It has no caller until RELEASE.
  workflow_call:

# Read-only by default. A job that needs to write says so itself.
permissions:
  contents: read

concurrency:
  # The `github.workflow` component exists to stop TWO callers cancelling each other — the trap
  # where a second caller kills the first and a release quietly half-ships. There is one caller
  # today, so its cause is gone; kept as cheap insurance, and the literal `tests-` prefix stays.
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# NO `paths-ignore`, deliberately. A required check that is skipped for a docs-only PR reports
# nothing, and a protection rule waiting on a check that will never arrive blocks the merge
# forever. The suite takes seconds; buying nothing is cheaper than buying that.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # One source, read by both workflows AND by Cloudflare Pages, which cannot read either
          # of them. A literal here would be a second spelling — see tests/toolchain.test.ts.
          node-version-file: '.node-version'
          cache: npm

      - run: npm ci

      # No `playwright install` step: the runner image ships Google Chrome at
      # /usr/bin/google-chrome, which `scripts/chromium.mjs` already finds. `npx playwright install`
      # would also pull the full `playwright` package — this repo has `playwright-core`, which ships
      # no CLI.
      #
      # `CI=true` is already set by Actions, which is what makes the browser-gate assertion in
      # tests/boot.browser.test.ts hard-fail here instead of skipping. That assertion is the whole
      # reason this job can be trusted: fifty browser tests once skipped for months on a green board.
      - run: npm run check

      # Inside the REQUIRED `test` job on purpose, rather than as a job of its own. A new job means a
      # new required context, which means a settings change — and an unrequired check is one nobody
      # is blocked by, which is how it rots. See docs/decisions/0019-a-probe-must-be-seen-to-apply.md.
      #
      # It mutates the working tree and restores it, so it runs LAST: nothing after it depends on the
      # tree, and a crash mid-probe cannot affect a step that has already passed.
      - run: npm run prove
