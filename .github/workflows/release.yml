# A RELEASE IS A TAG, and this is the only path to the origin players have installed.
#
# `main` is staging: Cloudflare Pages builds every push to it at
# `next.intothecoil.vulpecula.games`, and every branch gets a preview URL. Production moves only
# when a version tag says so. See docs/decisions/0011-three-environments-and-a-separate-origin-for-staging.md.
#
# ⚠️ NO `workflow_dispatch`, deliberately — this is a DEVIATION from the predecessor, which has one.
# The environment's deployment-branch policy is supposed to be the backstop, but that policy does
# not exist until the first deployment creates the environment, and until it is set the environment
# allows everything. A Run button during that window publishes whatever is on `main` to every
# installed app. The scaffold plan's own ladder puts "remove the affordance" above every other tier,
# and re-running a failed run from the Actions UI covers the only thing dispatch was for.
#
# ⚠️ TWO DESTINATIONS, AS SIBLINGS. `deploy` (Pages) and `itch` both depend on `build` and neither
# depends on the other, so one destination being down cannot gate the other. Consolidating two
# workflows into one bought a single version assertion and half the per-tag CI; it would have COST
# independent failure, and this job graph is what pays that back. Wiring itch behind Pages, or
# vice-versa, silently trades the property away — `tests/release.test.ts` holds the shape.
#
# ONE-TIME itch SETUP, none of which is in this repository:
#   1. itch.io → Settings → API keys → generate; store as the `BUTLER_API_KEY` repo secret.
#   2. After the FIRST push, on the itch Edit game page: tick "This file will be played in the
#      browser" on the html5 upload, and set Kind of project = HTML. butler keeps the flag on every
#      later push to the same channel, so this is set once, ever — and until it is set, the upload
#      is not playable.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false # never cancel a half-finished deploy to a live origin

jobs:
  # A RELEASE RUNS THE SUITE BEFORE IT REACHES ANYONE.
  #
  # `main` is already tested at merge, but a tag is not `main` — it is a specific commit plus
  # whatever happened to package.json on the way past, and this is the path to a device someone
  # already installed the game on. Called, never copied: the suite is described in tests.yml alone.
  test:
    uses: ./.github/workflows/tests.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Read from `.node-version`, never spelled here. Cloudflare Pages reads that same file and
          # cannot read this one, so a literal in this workflow would be a third spelling of a fact
          # that only has one true value — see tests/toolchain.test.ts.
          node-version-file: '.node-version'
          cache: npm

      # THE TAG MUST BE THE VERSION IT CLAIMS TO BE.
      #
      # `v1.2.3` deploying a build that reports `1.2.0` is unfalsifiable from the outside: the page
      # says one thing, the release says another, and a bug report quoting either is untraceable.
      # This is the assertion consolidating into one workflow was supposed to buy, so it is made
      # once, here, before anything is built.
      - name: the tag agrees with package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $tag but package.json says $pkg."
            echo "::error::Bump package.json and re-tag; do not move the tag."
            exit 1
          fi
          echo "releasing $pkg from $GITHUB_REF_NAME"

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # The SAME BYTES for itch, not merely the same build command.
      #
      # `upload-pages-artifact` packs a tar only Pages can consume, so itch needs its own copy —
      # and taking it from this job rather than rebuilding is what makes "one build, both
      # destinations" literally true. Two independent `npm ci && npm run build` runs share a command
      # and nothing else: they resolve dependencies separately and stamp a build id separately, so
      # the two destinations could ship different bytes under one version number and nothing would
      # say so.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # THE SECOND DESTINATION — a sibling of `deploy`, never downstream of it.
  #
  # ⚠️ ALWAYS THE SAME CHANNEL. An itch HTML5 game is served from a per-upload path, and
  # `localStorage` is scoped to origin AND path — so replacing the upload by hand can hand every
  # player a fresh, empty origin with their save still sitting in the old one, unreachable. butler
  # PATCHES the existing upload on the named channel rather than creating a new one, which is the
  # entire reason it is used here instead of dragging a zip into the web UI. The channel name is not
  # cosmetic and must never be changed once anyone has played.
  itch:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ITCH_TARGET: vulpeculagames/into-the-coil:html5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install butler
        run: |
          curl -sL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d "$HOME/butler"
          chmod +x "$HOME/butler/butler"
          echo "$HOME/butler" >> "$GITHUB_PATH"

      - name: Push to itch
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "::error::BUTLER_API_KEY is not set. See the one-time setup notes at the top of this file."
            exit 1
          fi
          # Named explicitly on failure: a wrong user or slug fails here and nowhere else, and the
          # raw butler error does not say which half was wrong.
          if ! butler push dist "$ITCH_TARGET" --userversion "${GITHUB_REF_NAME#v}"; then
            echo "::error::butler could not push to $ITCH_TARGET — check the itch user and game slug."
            exit 1
          fi
          butler status "${ITCH_TARGET%%:*}"

      - name: Summary
        run: |
          {
            echo "### Pushed \`${GITHUB_REF_NAME#v}\` to \`$ITCH_TARGET\`"
            echo ""
            echo "If this was the FIRST push: on the itch Edit game page, tick"
            echo "**This file will be played in the browser** on the html5 upload and set"
            echo "**Kind of project = HTML**. Until then the upload is not playable."
          } >> "$GITHUB_STEP_SUMMARY"

  # A GREEN DEPLOYMENT IS NOT A WORKING ONE.
  #
  # The predecessor's first staging deploy went green while serving the repository root, and this
  # project's did the same — `/src/main.ts` returning 200 with real TypeScript in it, on a URL that
  # reported success everywhere else. Nothing upstream of here can catch that: the build was fine,
  # the upload was fine, and the host served something else.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
      - run: node scripts/verify-deploy.mjs "${{ needs.deploy.outputs.url }}"
