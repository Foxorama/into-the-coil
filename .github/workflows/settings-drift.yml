name: settings-drift

on:
  schedule:
    # Weekly, the morning after the hotspots report, so the two never contend for attention.
    - cron: '0 8 * * 2'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: settings-drift
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'

      - id: check
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          # Optional, and without it most of this check is inert. A fine-grained PAT with
          # *Administration: read* on this repo. The built-in token cannot see the merge flags at
          # all (they are omitted from the response) and gets 403 on branch protection; no
          # `permissions:` key can grant either. Absent, the report says NOT CHECKED and lists them.
          SETTINGS_READ_TOKEN: ${{ secrets.SETTINGS_READ_TOKEN }}
        run: |
          # ⚠️ Two failures already found here, both about the REPORT rather than the check.
          #
          # 1. `node … | tee` reports TEE's exit code, and this shell has no pipefail, so a script
          #    that threw still exited 0 and the step passed green.
          # 2. A throw writes to stderr and prints nothing to stdout, so `drift.md` was EMPTY and
          #    the issue it opened had a blank body — a guard that fired and said nothing.
          #
          # So: fail on error, and if the report never got written, put the error in its place.
          set -o pipefail
          if node scripts/settings-drift.mjs "$GITHUB_REPOSITORY" > drift.md 2> drift.err; then
            cat drift.md
          else
            if [ ! -s drift.md ]; then
              {
                echo "## Settings drift check FAILED"
                echo
                echo "It could not read what it was asked to check. Unverifiable is not the same"
                echo "as correct, so this is a failure rather than a quiet pass."
                echo
                echo '```'
                cat drift.err
                echo '```'
              } > drift.md
            fi
            cat drift.md
            exit 1
          fi

      - run: cat drift.md >> "$GITHUB_STEP_SUMMARY"

      # Only speaks up when something is wrong. A job that opens an issue every week to say
      # "still fine" is a job whose issues stop being read — see the rolling-issue note in
      # hotspots.yml, same failure.
      - if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Repository settings have drifted
        run: |
          num=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
                  --jq "[.[] | select(.title == \"$TITLE\")][0].number")
          if [ -n "$num" ] && [ "$num" != "null" ]; then
            gh issue edit "$num" --body-file drift.md
          else
            gh issue create --title "$TITLE" --body-file drift.md
          fi

      # …and go quiet again when it is fixed. Without this the issue stays open forever after one
      # bad run, so the next real drift arrives on an issue that is already open and already
      # ignored — the wallpaper failure, reached from the other direction.
      - if: steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Repository settings have drifted
        run: |
          num=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
                  --jq "[.[] | select(.title == \"$TITLE\")][0].number")
          if [ -n "$num" ] && [ "$num" != "null" ]; then
            gh issue close "$num" --comment "Settings match again — closed by the $GITHUB_WORKFLOW run that verified it."
            echo "closed issue #$num"
          fi

      # Re-fail the job. `continue-on-error` above exists to let the issue be opened first.
      - if: steps.check.outcome == 'failure'
        run: |
          echo "settings drift detected — see the issue and the summary above"
          exit 1
